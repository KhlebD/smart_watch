[env:esp32-s3-zero]

; ── Platform and board ───────────────────────────────────────────────────────
; Standard espressif32 platform — works with the custom board JSON file
platform = espressif32

; Custom board definition — requires boards/esp32-s3-zero-s3fh4r2.json
; to exist in your project root
board = esp32-s3-zero-s3fh4r2

; Tell PlatformIO this is an ESP32-S3 chip specifically
board_build.mcu = esp32s3

; Arduino framework
framework = arduino

; ── Upload ───────────────────────────────────────────────────────────────────
; Fast upload speed — works reliably with S3 Zero USB
upload_speed = 921600

; ── Build flags ──────────────────────────────────────────────────────────────
build_flags =
    ; ESP32-S3 has PSRAM — enable it
    -DBOARD_HAS_PSRAM

    ; S3 Zero uses native USB (not UART chip)
    ; These two flags enable Serial over USB CDC
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; Tell NimBLE-Arduino to use the ESP32 framework's
    ; built-in NimBLE stack instead of compiling its own
    ; This fixes the multiple definition linker errors
    -DCONFIG_NIMBLE_CPP_IDF_API=1

    ; Tell LVGL to look for lv_conf.h in the src/ folder
    -DLV_CONF_INCLUDE_SIMPLE

    ; Add src/ to include path so headers find each other
    -I src
build_unflags = -DUSE_ESP32_BLE
lib_deps =
    lovyan03/LovyanGFX
    bblanchon/ArduinoJson
    h2zero/NimBLE-Arduino@^1.4.2
    lvgl/lvgl@^8.3.11
    adafruit/Adafruit BMP280 Library
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    adafruit/RTClib
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_archive = no
lib_ignore = BLE
[env:esp32-s3-zero]

; ── Platform and board ───────────────────────────────────────────────────────
; Standard espressif32 platform — works with the custom board JSON file
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
; Custom board definition — requires boards/esp32-s3-zero-s3fh4r2.json
; to exist in your project root
board = esp32-s3-zero-s3fh4r2

; Tell PlatformIO this is an ESP32-S3 chip specifically
board_build.mcu = esp32s3

; Arduino framework
framework = arduino

; ── Upload ───────────────────────────────────────────────────────────────────
; Fast upload speed — works reliably with S3 Zero USB
upload_speed = 921600

; ── Build flags ──────────────────────────────────────────────────────────────
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_NIMBLE_CPP_IDF_API=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
    
build_unflags = -DUSE_ESP32_BLE
lib_deps =
    lovyan03/LovyanGFX
    bblanchon/ArduinoJson
    h2zero/NimBLE-Arduino@^1.4.2
    lvgl/lvgl@^8.3.11
    adafruit/Adafruit BMP280 Library
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    adafruit/RTClib
    adafruit/Adafruit NeoPixel
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_archive = no
lib_ignore = BLE